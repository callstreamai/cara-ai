services:
  - type: web
    name: cara-ai
    runtime: node
    plan: starter
    region: ohio
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SLACK_CLIENT_ID
        sync: false
      - key: SLACK_WORKSPACE_ID
        sync: false
      - key: SLACK_REDIRECT_URI
        sync: false
      - key: SLACK_SESSION_SECRET
        sync: false
      - key: NODE_VERSION
        value: 20.11.1
