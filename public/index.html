<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>CARA — Call Stream AI</title>
  <meta name="description" content="CARA, a warm and precise AI assistant by Call Stream AI." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23000'/%3E%3Ccircle cx='22' cy='32' r='5' fill='%23D560B2'/%3E%3Cpath d='M34 20 A18 18 0 0 1 34 44' stroke='%23F5F5F5' stroke-width='3.5' fill='none' stroke-linecap='round'/%3E%3Cpath d='M42 22 A14 14 0 0 1 42 42' stroke='%23F5F5F5' stroke-width='3.5' fill='none' stroke-linecap='round' opacity='0.7'/%3E%3Cpath d='M50 25 A10 10 0 0 1 50 39' stroke='%23F5F5F5' stroke-width='3.5' fill='none' stroke-linecap='round' opacity='0.44'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <!-- ============ AUTH SCREEN ============ -->
  <div id="auth-screen" class="auth-screen" hidden>
    <div class="auth-card">
      <svg class="auth-mark" viewBox="0 0 64 64" aria-hidden="true">
        <circle cx="22" cy="32" r="5" fill="#D560B2"></circle>
        <path d="M34 20 A18 18 0 0 1 34 44" stroke="#F5F5F5" stroke-width="3.5" fill="none" stroke-linecap="round"></path>
        <path d="M42 22 A14 14 0 0 1 42 42" stroke="#F5F5F5" stroke-width="3.5" fill="none" stroke-linecap="round" opacity="0.7"></path>
        <path d="M50 25 A10 10 0 0 1 50 39" stroke="#F5F5F5" stroke-width="3.5" fill="none" stroke-linecap="round" opacity="0.44"></path>
      </svg>
      <div class="auth-eyebrow">CALL STREAM AI</div>
      <h1 class="auth-title" id="auth-title">Welcome to <span class="accent">CARA</span></h1>
      <p class="auth-sub" id="auth-sub">Sign in to start chatting.</p>

      <form id="auth-form" class="auth-form">
        <label class="field">
          <span class="field-label">Email</span>
          <input id="auth-email" type="email" autocomplete="email" placeholder="you@example.com" required />
        </label>
        <label class="field">
          <span class="field-label">Password</span>
          <input id="auth-password" type="password" autocomplete="current-password" placeholder="••••••••" minlength="6" required />
        </label>
        <div id="auth-error" class="auth-error" hidden></div>
        <button id="auth-submit" type="submit" class="auth-submit">Sign in</button>
      </form>

      <div class="auth-switch">
        <span id="auth-switch-text">New here?</span>
        <button id="auth-switch-btn" type="button" class="link-btn">Create an account</button>
      </div>
    </div>
    <div class="auth-foot">Powered by Sakana Fugu</div>
  </div>

  <!-- ============ CHAT APP ============ -->
  <div id="app" hidden>
    <aside id="sidebar">
      <div class="sidebar-head">
        <div class="brand">
          <svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true">
            <circle cx="22" cy="32" r="5" fill="#D560B2"></circle>
            <path d="M34 20 A18 18 0 0 1 34 44" stroke="#F5F5F5" stroke-width="3.5" fill="none" stroke-linecap="round"></path>
            <path d="M42 22 A14 14 0 0 1 42 42" stroke="#F5F5F5" stroke-width="3.5" fill="none" stroke-linecap="round" opacity="0.7"></path>
            <path d="M50 25 A10 10 0 0 1 50 39" stroke="#F5F5F5" stroke-width="3.5" fill="none" stroke-linecap="round" opacity="0.44"></path>
          </svg>
          <span class="brand-word">CARA</span>
        </div>
        <button id="new-chat" class="btn-new" title="New chat">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          New chat
        </button>
      </div>

      <div class="convo-label">Conversations</div>
      <nav id="convo-list" class="convo-list"></nav>

      <div class="sidebar-foot">
        <button id="user-menu" class="user-menu" type="button">
          <span class="user-avatar" id="user-avatar">U</span>
          <span class="user-email" id="user-email">user@example.com</span>
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M16 17l5-5-5-5M21 12H9M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/></svg>
        </button>
      </div>
    </aside>

    <main id="main">
      <header id="topbar">
        <button id="menu-toggle" class="icon-btn" aria-label="Toggle menu">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
        </button>
        <div class="topbar-title"><span id="convo-title">New chat</span></div>
        <div class="model-pill"><span class="pill-dot"></span>FUGU</div>
      </header>

      <section id="messages" class="messages">
        <div id="welcome" class="welcome">
          <svg class="welcome-mark" viewBox="0 0 64 64" aria-hidden="true">
            <circle cx="22" cy="32" r="5" fill="#D560B2"></circle>
            <path d="M34 20 A18 18 0 0 1 34 44" stroke="#F5F5F5" stroke-width="3.5" fill="none" stroke-linecap="round"></path>
            <path d="M42 22 A14 14 0 0 1 42 42" stroke="#F5F5F5" stroke-width="3.5" fill="none" stroke-linecap="round" opacity="0.7"></path>
            <path d="M50 25 A10 10 0 0 1 50 39" stroke="#F5F5F5" stroke-width="3.5" fill="none" stroke-linecap="round" opacity="0.44"></path>
          </svg>
          <h1 class="welcome-title">Ask CARA <span class="accent">anything.</span></h1>
          <p class="welcome-sub">A warm, precise assistant — answered in real time.</p>
          <div class="suggestions" id="suggestions">
            <button class="suggestion" data-q="Explain quantum computing in one paragraph.">Explain quantum computing simply</button>
            <button class="suggestion" data-q="Draft a friendly out-of-office email for next week.">Draft an out-of-office email</button>
            <button class="suggestion" data-q="Give me three dinner ideas using chicken and rice.">Three quick dinner ideas</button>
            <button class="suggestion" data-q="What's the difference between TCP and UDP?">TCP vs UDP, briefly</button>
          </div>
        </div>
      </section>

      <footer id="composer">
        <form id="chat-form" class="composer-inner">
          <textarea id="input" rows="1" placeholder="Message CARA…" autocomplete="off"></textarea>
          <button id="send" type="submit" class="send-btn" aria-label="Send" disabled>
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 11l5-5 5 5M12 6v12"/></svg>
          </button>
        </form>
        <div class="composer-foot">CARA can make mistakes. Verify important details.</div>
      </footer>
    </main>
  </div>

  <div id="boot" class="boot"><div class="boot-spinner"></div></div>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
